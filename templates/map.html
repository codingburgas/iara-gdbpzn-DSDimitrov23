<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>ИАРА - Карта и Риболов</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100%; }
        .fishing-panel {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 260px;
        }
        button { width: 100%; padding: 12px; background: #2980b9; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #1f6391; }
        .back-btn { background: #7f8c8d; }
    </style>
</head>
<body>
    <div class="fishing-panel">
        <h3 id="loc-name">Изберете водоем</h3>
        <p id="status">Кликнете върху маркер на картата</p>
        <button id="fishBtn" onclick="startFishing()" style="display: none; background: #27ae60;">Започни риболов</button>
        <button class="back-btn" onclick="window.location.href='/'">Назад към таблото</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        const map = L.map('map').setView([42.7, 25.3], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const spots = [
            { name: "Язовир Искър", coords: [42.45, 23.55], fish: ["Пъстърва", "Костур", "Платика"] },
            { name: "Река Камчия", coords: [43.02, 27.88], fish: ["Шаран", "Каракуда"] }
        ];

        let selectedSpot = null;

        spots.forEach(s => {
            const marker = L.marker(s.coords).addTo(map);
            marker.on('click', () => {
                selectedSpot = s;
                document.getElementById('loc-name').innerText = s.name;
                document.getElementById('status').innerText = "Готови за риболов!";
                document.getElementById('fishBtn').style.display = 'block';
            });
        });

        async function startFishing() {
            if (!selectedSpot) return;
            const btn = document.getElementById('fishBtn');
            btn.disabled = true;
            btn.innerText = "Ловите...";

            setTimeout(async () => {
                const success = Math.random() > 0.4;
                if (success) {
                    const fish = selectedSpot.fish[Math.floor(Math.random() * selectedSpot.fish.length)];
                    alert(`🎉 Успех! Хванахте ${fish} в ${selectedSpot.name}!`);
                    await saveCatchToDB(fish, selectedSpot.name);
                } else {
                    alert("🎣 Рибата се откачи... Опитайте пак!");
                }
                btn.disabled = false;
                btn.innerText = "Започни риболов";
            }, 1500);
        }
    </script>
</body>
</html>

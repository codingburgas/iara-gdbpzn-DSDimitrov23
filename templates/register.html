{% extends "base.html" %}

{% block body_class %}no-sidebar{% endblock %}

{% block content %}
<div class="auth-wrapper no-sidebar">
    <div class="auth-hero">
        <div class="inner">
            <h1>Станете част от ИАРА</h1>
            <p class="lead">Създайте профил, за да управлявате разрешителни, проверки и издаване на риболовни билети.</p>
        </div>
        <div class="hero-decor"></div>
    </div>

    <div class="auth-panel">
        <div class="auth-card">
            <div class="logo"><span>⚓</span> ИАРА</div>
            <h2>Регистрация</h2>
            <form onsubmit="handleRegister(event)">
                <input type="text" id="regUser" placeholder="Потребителско име *" autocomplete="username" required>
                <input type="email" id="regEmail" placeholder="Електронна поща *" autocomplete="email" required>
                <input type="password" id="regPass" placeholder="Парола, минимум 8 символа *" autocomplete="new-password" minlength="8" required>
                <input type="text" id="regFullName" placeholder="Пълно име">
                <input type="text" id="regPhone" placeholder="Телефон">

                <select id="regRole" style="margin-top: 12px;">
                    <option value="Любител рибар">Любител рибар</option>
                    <option value="Инспектор на ИАРА">Инспектор на ИАРА</option>
                    <option value="Капитан на кораб">Капитан на кораб</option>
                </select>

                <div class="field-row">
                    <input type="text" id="regVessel" placeholder="Регистрация на кораб" style="margin-top: 12px;">
                    <input type="text" id="regPermit" placeholder="Разрешително №" style="margin-top: 12px;">
                </div>

                <button type="submit" class="primary">Създай профил</button>
            </form>
            <p class="muted">Вече имате профил? <a href="/login">Вход</a></p>
        </div>
    </div>
</div>
{% endblock %}

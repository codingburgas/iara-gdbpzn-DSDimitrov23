<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>ИАРА - Регистрация</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a2a6c; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h2 { color: #1a2a6c; margin-bottom: 25px; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        button:hover { background: #219653; }
        p { margin-top: 20px; font-size: 14px; color: #666; }
        a { color: #2980b9; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Регистрация</h2>
        <form onsubmit="handleRegister(event)">
            <input type="text" id="regUser" placeholder="Потребителско име" required>
            <input type="email" id="regEmail" placeholder="Електронна поща" required>
            <input type="password" id="regPass" placeholder="Парола" required>
            <button type="submit">Създай профил</button>
        </form>
        <p><a href="/login">Вход</a></p>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>

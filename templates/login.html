{% extends "base.html" %}

{% block body_class %}no-sidebar{% endblock %}

{% block content %}
<div class="auth-wrapper no-sidebar">
    <div class="auth-hero">
        <div class="inner">
            <h1>Добре дошли в ИАРА</h1>
            <p class="lead">Достъп до контролния панел за управление, проверки и издаване на разрешителни.</p>
        </div>
        <div class="hero-decor"></div>
    </div>
    <div class="auth-panel">
        <div class="auth-card">
            <div class="logo"><span>⚓</span> ИАРА</div>
            <h2>Вход</h2>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="loginUser" placeholder="Потребителско име или имейл" autocomplete="username" required>
                <div style="position:relative; margin-top: 12px; margin-bottom: 12px;">
                    <input type="password" id="loginPass" placeholder="Парола" autocomplete="current-password" required style="padding-right: 72px;">
                    <button type="button" class="show-pass" onclick="togglePass('loginPass')" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:transparent; color:var(--accent); padding:6px 8px;">Покажи</button>
                </div>
                <button type="submit" class="primary">Влез</button>
            </form>
            <p class="muted">Нямате профил? <a href="/register">Създайте профил</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function togglePass(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
    <div class="topbar profile-topbar">
        <div class="title-group">
            <p>Профил</p>
            <h1>Вашата информация</h1>
        </div>
        <div class="topbar-actions">
            <button class="primary" onclick="triggerEditProfile()">Редактирай информация</button>
            <button onclick="triggerChangePassword()">Смени парола</button>
        </div>
    </div>

    <div class="profile-layout">
        <section class="profile-card">
            <div class="profile-header">
                <div id="avatar-initials" class="profile-avatar">??</div>
                <div>
                    <h3 id="prof-name">—</h3>
                    <p id="prof-role">—</p>
                </div>
            </div>
            <div class="card-list">
                <div class="item profile-field">
                    <span>Име</span>
                    <div class="profile-field-value">
                        <strong id="detail-name">—</strong>
                        <button class="field-edit-button" onclick="editProfileField('fullname', 'име', 'detail-name')">Редактиране</button>
                    </div>
                </div>
                <div class="item profile-field">
                    <span>Потребителско име</span>
                    <div class="profile-field-value">
                        <strong id="detail-username">—</strong>
                        <button class="field-edit-button" onclick="editProfileField('username', 'потребителско име', 'detail-username')">Редактиране</button>
                    </div>
                </div>
                <div class="item profile-field">
                    <span>Имейл</span>
                    <div class="profile-field-value">
                        <strong id="detail-email">—</strong>
                        <button class="field-edit-button" onclick="editProfileField('email', 'имейл', 'detail-email')">Редактиране</button>
                    </div>
                </div>
                <div class="item profile-field">
                    <span>Телефон</span>
                    <div class="profile-field-value">
                        <strong id="detail-phone">—</strong>
                        <button class="field-edit-button" onclick="editProfileField('phone', 'телефон', 'detail-phone')">Редактиране</button>
                    </div>
                </div>
                <div class="item profile-field">
                    <span>Роля</span>
                    <div class="profile-field-value">
                        <strong id="detail-role">—</strong>
                        <button class="field-edit-button" onclick="editProfileField('role', 'роля', 'detail-role')">Редактиране</button>
                    </div>
                </div>
                <div class="item profile-field">
                    <span>Кораб</span>
                    <div class="profile-field-value">
                        <strong id="detail-vessel">—</strong>
                        <button class="field-edit-button" onclick="editProfileField('vessel', 'кораб', 'detail-vessel')">Редактиране</button>
                    </div>
                </div>
                <div class="item profile-field">
                    <span>Разрешително</span>
                    <div class="profile-field-value">
                        <strong id="detail-permit">—</strong>
                        <button class="field-edit-button" onclick="editProfileField('permit', 'разрешително', 'detail-permit')">Редактиране</button>
                    </div>
                </div>
                <div class="item profile-field">
                    <span>Член от</span>
                    <div class="profile-field-value">
                        <strong id="prof-date">—</strong>
                        <button class="field-edit-button" onclick="editProfileField('member_since', 'дата на членство', 'prof-date')">Редактиране</button>
                    </div>
                </div>
            </div>
        </section>
    </div>
{% endblock %}

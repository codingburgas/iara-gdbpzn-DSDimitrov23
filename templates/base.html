<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИАРА Система</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="sidebar">
        <h2>⚓ ИАРА</h2>
        <p id="userGreeting">Зареждане...</p>
        <a href="/dashboard">📊 Табло за управление</a>
        <a href="/profile">👤 Профил</a>
        <a href="/map">🗺️ Карта на водоемите</a>
        <a href="/tickets">🎫 Риболовни билети</a>
        <div class="logout-btn" id="authBtn">Изход</div>
    </div>
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>

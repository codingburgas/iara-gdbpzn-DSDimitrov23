<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИАРА - Контролен панел</title>
    <style>
        :root { 
            --navy: #1a2a6c; 
            --blue: #2980b9; 
            --white: #ffffff; 
            --light: #f4f7f6; 
            --accent: #f39c12; 
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: var(--light); color: #333; }
        
        .sidebar { width: 260px; height: 100vh; background: var(--navy); color: white; position: fixed; z-index: 100; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h2 { color: var(--accent); margin: 0; font-size: 22px; letter-spacing: 1px; margin-bottom: 20px; }
        
        .auth-status { padding: 15px; text-align: center; background: rgba(0,0,0,0.2); border-radius: 8px; margin: 0 10px; }
        #userGreeting { font-size: 13px; display: block; margin-bottom: 10px; color: #bdc3c7; }

        .sidebar-menu { padding-top: 20px; }
        .sidebar-menu a { 
            display: block; 
            padding: 15px 25px; 
            color: #ecf0f1; 
            text-decoration: none; 
            cursor: pointer; 
            transition: 0.3s;
            border-left: 4px solid transparent;
        }
        .sidebar-menu a:hover { 
            background: rgba(255,255,255,0.05); 
            color: var(--accent); 
            border-left: 4px solid var(--accent);
        }

        .main-content { margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
        h1 { color: var(--navy); margin-bottom: 30px; font-weight: 300; }
        
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        .stats { display: flex; gap: 20px; margin-bottom: 40px; }
        .stat-card { flex: 1; background: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--blue); }
        .stat-card h3 { font-size: 28px; margin: 10px 0; color: var(--navy); }
        .stat-card p { margin: 0; color: #7f8c8d; font-size: 12px; text-transform: uppercase; }

        input, select { padding: 12px; margin: 10px 0; width: 100%; max-width: 400px; border: 1px solid #ddd; border-radius: 6px; }
        button { padding: 12px 28px; background: var(--blue); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        button:hover { background: #1f6391; transform: translateY(-1px); }
        
        #res, #ticketMsg { padding: 15px; border-radius: 6px; margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>⚓ ИАРА</h2>
            <div class="auth-status">
                <span id="userGreeting">Здравейте, Гост</span>
                <button id="authBtn" onclick="window.location.href='/login'" style="background: var(--accent); padding: 8px 15px; width: 100%; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer;">
                    Вход / Регистрация
                </button>
            </div>
        </div>
        <div class="sidebar-menu">
            <a onclick="showSection('dashboard')">📊 Табло за управление</a>
            <a onclick="showSection('tickets')">🎫 Риболовни билети</a>
            <a onclick="showSection('inspections')">📋 Инспекции</a>
        </div>
    </div>

    <div class="main-content">
        <div id="dashboard-section">
            <h1>Контролен панел</h1>
            <div class="stats">
                <div class="stat-card"><h3>1,240</h3><p>Кораби</p></div>
                <div class="stat-card"><h3>892</h3><p>Активни Лицензи</p></div>
                <div class="stat-card"><h3>156</h3><p>Проверки (М)</p></div>
                <div class="stat-card"><h3>4,210</h3><p>Билети</p></div>
            </div>
            <div class="card">
                <h3>🔍 Проверка на плавателен съд</h3>
                <input type="text" id="cfrInput" placeholder="Въведете CFR (напр. BGR001)">
                <button onclick="verify()">Провери базата</button>
                <div id="res"></div>
            </div>
        </div>

        <div id="tickets-section" style="display: none;">
            <h1>Издаване на билети</h1>
            <div class="card">
                <h3>🎫 Нов любителски билет</h3>
                <select id="ticketType">
                    <option value="25">Годишен стандартен - 25.00 лв.</option>
                    <option value="10">Намален (Деца/Пенсионери) - 10.00 лв.</option>
                    <option value="0">Безплатен (ТЕЛК) - 0.00 лв.</option>
                </select>
                <button onclick="issueTicket()">Запиши и издай</button>
                <div id="ticketMsg"></div>
            </div>
        </div>

        <div id="inspections-section" style="display: none;">
            <h1>Инспекции</h1>
            <div class="card">
                <h3>📋 Нов инспекционен доклад</h3>
                <input type="text" placeholder="Локация">
                <input type="text" placeholder="Инспектор">
                <button onclick="alert('Докладът е записан!')">Изпрати данни</button>
            </div>
        </div>
    </div>

    <script>
        function showSection(sectionId) {
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('tickets-section').style.display = 'none';
            document.getElementById('inspections-section').style.display = 'none';
            document.getElementById(sectionId + '-section').style.display = 'block';
        }
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
